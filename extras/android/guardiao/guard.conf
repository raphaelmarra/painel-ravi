# Guardiao do S20 — todos os limites ficam aqui. Mudou? O guardiao le de novo a cada volta.
INTERVAL=60            # segundos entre verificacoes
FAILS=3                # falhas seguidas antes de reiniciar um servico
MAX_RESTARTS=3         # reinicios maximos por servico dentro da janela
WINDOW=1800            # janela do freio, em segundos (30 min)
DISK_MIN_PCT=10        # alerta se o /data tiver menos que isto livre
MEM_MIN_MB=300         # alerta se a RAM disponivel cair abaixo disto
TEMP_MAX=45            # alerta se a bateria passar desta temperatura (C)
TS_EXPIRY_DAYS=14      # alerta antes de a chave do Tailscale expirar
RAVI_PROBE_SESSION=""  # nome de uma sessao ativa: prova que o processo do RAVI responde
BACKUP_HOUR=03         # backup diario nesta hora
BACKUP_KEEP=7          # copias guardadas
UPDATE_DOW=7           # dia da semana da atualizacao (1=seg ... 7=dom)
UPDATE_HOUR=04         # hora da atualizacao
ALERT_REPEAT=21600     # nao repete o mesmo alerta antes disto (6 h)
TELA_USO_MIN=30         # minutos ate a tela voltar ao modo servidor
BAT_MIN=30             # % em que volta a carregar
BAT_MAX=80             # % em que corta a energia e deixa drenar
